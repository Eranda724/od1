name: Potato
description: "60 seconds routine"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_messaging: ^15.1.3
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  video_player: ^2.11.1
  confetti: ^0.8.0
  share_plus: ^13.1.0
  audioplayers: ^6.1.0
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFC93C"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#FFC93C"
  image: "assets/icon/splash_logo.png"
  android_12:
    color: "#FFC93C"
    branding: "assets/icon/splash_logo.png"
    branding_bottom_padding: 200